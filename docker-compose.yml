
services:
  db:
    image: postgres:17
    container_name: pulse-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: pulse_user
      POSTGRES_PASSWORD: pulse_dev_password
      POSTGRES_DB: pulse_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_user -d pulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
